  awareness-tests: npm.cmd test -- tests/awareness.test.ts
  map-tests: npm.cmd test -- tests/map-geography.test.ts tests/map-layer-install.test.ts
  migration-tests: npm.cmd test -- tests/db-migrate.test.ts tests/db-reconcile-legacy.test.ts tests/db-repair-legacy.test.ts tests/sql-suite-runner.test.ts

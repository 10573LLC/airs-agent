name: AIRS Production Deploy

on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: "Dedicated AIRS Production member account ID"
        required: true
        type: string
      activate_services:
        description: "Start HTTPS AIRS services after ACM and Cloudflare DNS are ready"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: airs-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      TF_VAR_expected_account_id: ${{ inputs.aws_account_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws_account_id }}:role/AIRSAgentGitHubDeployRole
          aws-region: us-east-2

      - name: Verify dedicated AIRS account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "${{ inputs.aws_account_id }}"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Application checks
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build

      - name: Terraform init and validate
        working-directory: infra/terraform
        run: |
          terraform init             -backend-config="bucket=airs-agent-tfstate-${{ inputs.aws_account_id }}"             -backend-config="key=production/terraform.tfstate"             -backend-config="region=us-east-2"             -backend-config="encrypt=true"             -backend-config="use_lockfile=true"
          terraform fmt -check -recursive
          terraform validate

      - name: Provision foundation with services stopped
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve             -var='container_image=public.ecr.aws/amazonlinux/amazonlinux:2023'             -var='ops_image=public.ecr.aws/amazonlinux/amazonlinux:2023'             -var='deploy_services=false'             -var='enable_https=false'

      - name: Configure restricted AIRS map key
        run: |
          RESTRICTIONS='{"AllowActions":["geo-maps:*"],"AllowResources":["arn:aws:geo-maps:us-east-2::provider/default"],"AllowReferers":["https://app.airsagent.com/*"]}'
          if aws location describe-key --region "$AWS_REGION" --key-name airs-agent-prod-maps >/dev/null 2>&1; then
            aws location update-key \
              --region "$AWS_REGION" \
              --key-name airs-agent-prod-maps \
              --restrictions "$RESTRICTIONS" \
              --no-expiry \
              --force-update >/dev/null
          else
            aws location create-key \
              --region "$AWS_REGION" \
              --key-name airs-agent-prod-maps \
              --description "AIRS Agent production browser map key" \
              --restrictions "$RESTRICTIONS" \
              --no-expiry \
              --tags Application=AIRS-Agent,Environment=Production,Owner=10573LLC >/dev/null
          fi

      - name: Build and push immutable runtime and ops images
        id: image
        env:
          REGISTRY: ${{ inputs.aws_account_id }}.dkr.ecr.us-east-2.amazonaws.com
          REPOSITORY: airs-agent
          SHA: ${{ github.sha }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          RUNTIME="$REGISTRY/$REPOSITORY:sha-$SHA"
          OPS="$REGISTRY/$REPOSITORY:ops-sha-$SHA"

          MAP_KEY=$(aws location describe-key \
            --region "$AWS_REGION" \
            --key-name airs-agent-prod-maps \
            --query 'Key' \
            --output text)
          test -n "$MAP_KEY"
          MAP_STYLE_URL="https://maps.geo.us-east-2.amazonaws.com/v2/styles/Standard/descriptor?key=$MAP_KEY"

          docker build \
            --target runtime \
            --build-arg VITE_MAP_STYLE_URL="$MAP_STYLE_URL" \
            -t "$RUNTIME" .
          docker build \
            --target ops \
            --build-arg VITE_MAP_STYLE_URL="$MAP_STYLE_URL" \
            -t "$OPS" .
          docker push "$RUNTIME"
          docker push "$OPS"

          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "ops=$OPS" >> "$GITHUB_OUTPUT"

      - name: Register immutable images with services stopped
        working-directory: infra/terraform
        env:
          RUNTIME_IMAGE: ${{ steps.image.outputs.runtime }}
          OPS_IMAGE: ${{ steps.image.outputs.ops }}
        run: |
          terraform apply -input=false -auto-approve             -var="container_image=$RUNTIME_IMAGE"             -var="ops_image=$OPS_IMAGE"             -var='deploy_services=false'             -var='enable_https=false'

      - name: Run production database bootstrap and migrations
        working-directory: infra/terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          SG=$(terraform output -raw app_security_group_id)
          TASKDEF=$(terraform output -raw migration_task_definition_arn)

          TASK=$(aws ecs run-task             --region "$AWS_REGION"             --cluster "$CLUSTER"             --task-definition "$TASKDEF"             --launch-type FARGATE             --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}"             --query 'tasks[0].taskArn'             --output text)

          test "$TASK" != "None"
          aws ecs wait tasks-stopped --region "$AWS_REGION" --cluster "$CLUSTER" --tasks "$TASK"

          EXIT=$(aws ecs describe-tasks             --region "$AWS_REGION"             --cluster "$CLUSTER"             --tasks "$TASK"             --query 'tasks[0].containers[0].exitCode'             --output text)

          if [ "$EXIT" != "0" ]; then
            aws ecs describe-tasks               --region "$AWS_REGION"               --cluster "$CLUSTER"               --tasks "$TASK"               --query 'tasks[0].[stopCode,stoppedReason,containers[0].reason]'               --output text
            exit 1
          fi

      - name: Verify ACM certificate before activation
        if: inputs.activate_services
        working-directory: infra/terraform
        run: |
          CERT=$(terraform output -raw acm_certificate_arn)
          STATUS=$(aws acm describe-certificate             --region "$AWS_REGION"             --certificate-arn "$CERT"             --query 'Certificate.Status'             --output text)
          echo "ACM status: $STATUS"
          test "$STATUS" = "ISSUED"

      - name: Start HTTPS AIRS services
        if: inputs.activate_services
        working-directory: infra/terraform
        env:
          RUNTIME_IMAGE: ${{ steps.image.outputs.runtime }}
          OPS_IMAGE: ${{ steps.image.outputs.ops }}
        run: |
          terraform apply -input=false -auto-approve             -var="container_image=$RUNTIME_IMAGE"             -var="ops_image=$OPS_IMAGE"             -var='deploy_services=true'             -var='enable_https=true'

      - name: Wait for AIRS services
        if: inputs.activate_services
        working-directory: infra/terraform
        run: |
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          aws ecs wait services-stable             --region "$AWS_REGION"             --cluster "$CLUSTER"             --services "$(terraform output -raw app_service_name)"
          aws ecs wait services-stable             --region "$AWS_REGION"             --cluster "$CLUSTER"             --services "$(terraform output -raw maintenance_service_name)"

      - name: Deployment handoff
        working-directory: infra/terraform
        run: |
          echo "AIRS account: ${{ inputs.aws_account_id }}"
          echo "ALB DNS: $(terraform output -raw alb_dns_name)"
          echo "ACM certificate: $(terraform output -raw acm_certificate_arn)"
          echo "ACM DNS validation records:"
          terraform output -json acm_dns_validation
          echo "Cognito user pool: $(terraform output -raw cognito_user_pool_id)"
          echo "Cognito client: $(terraform output -raw cognito_client_id)"
          echo "Cognito domain: $(terraform output -raw cognito_domain)"
          echo "Runtime image: ${{ steps.image.outputs.runtime }}"
          echo "Ops image: ${{ steps.image.outputs.ops }}"

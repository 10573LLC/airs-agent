name: AIRS AWS Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/aws-terraform.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply reviewed production plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::509581811007:role/AIRSAgentGitHubDeployRole
          aws-region: us-east-2

      - name: Verify AWS account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "509581811007"

      - name: Terraform init
        run: terraform init

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -input=false             -var='container_image=bootstrap-not-deployed'             -var='public_base_url=https://app.airsagent.com'             -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.apply
        run: terraform apply -input=false -auto-approve tfplan

# Full stack: PostgreSQL 16 + the application, no builder services involved.
#   cp .env.example .env   # then set POSTGRES_PASSWORD and APP_DB_PASSWORD
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airs_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airs
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD:?set MAINTENANCE_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      # Persistent database storage.
      - airs_pgdata:/var/lib/postgresql/data
      # Applied once on first start of an empty data directory. A single
      # initialization script reads the canonical manifest so the Docker path
      # and `npm run db:migrate` can never drift, and every applied migration
      # is recorded in the persistent ledger.
      - ./db:/airs-db:ro
      - ./db/init/00_apply_migrations.sh:/docker-entrypoint-initdb.d/00_apply_migrations.sh:ro
      - ./db/seed/demo_orgs.sql:/docker-entrypoint-initdb.d/07_demo_orgs.sql:ro
      - ./db/init/04_app_role_login.sh:/docker-entrypoint-initdb.d/08_app_role_login.sh:ro
      - ./db/init/05_maintenance_role_login.sh:/docker-entrypoint-initdb.d/09_maintenance_role_login.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airs_owner -d airs"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The application always connects as the unprivileged airs_app role so
      # row-level security is enforced (owners and superusers would bypass it).
      DATABASE_URL: postgres://airs_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/airs
      DB_DRIVER: postgres
      NODE_ENV: production
      PORT: "3000"
      # The optional HTTP maintenance trigger is off by default; the scheduler
      # service below uses the command-line runner instead.
      AIRS_MAINTENANCE_ENDPOINT_ENABLED: ${AIRS_MAINTENANCE_ENDPOINT_ENABLED:-false}
      AIRS_MAINTENANCE_SECRET: ${AIRS_MAINTENANCE_SECRET:-}
    ports:
      - "3000:3000"

  # Portable scheduler. Runs the same standalone Node script an OS cron or a
  # Kubernetes CronJob would run; it talks to PostgreSQL directly and needs no
  # hosting-provider scheduler.
  expiration-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connects as airs_maintenance, never as the application role.
      AIRS_MAINTENANCE_DATABASE_URL: postgres://airs_maintenance:${MAINTENANCE_DB_PASSWORD:?set MAINTENANCE_DB_PASSWORD in .env}@db:5432/airs
      NODE_ENV: production
      AIRS_MAINTENANCE_INTERVAL_SECONDS: ${AIRS_MAINTENANCE_INTERVAL_SECONDS:-60}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do node scripts/expire-incident-state.mjs || echo "sweep failed"; sleep "$${AIRS_MAINTENANCE_INTERVAL_SECONDS:-60}"; done'

volumes:
  airs_pgdata:
